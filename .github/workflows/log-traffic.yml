name: Log Repository Traffic

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch and merge traffic data + generate report
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p data

          VIEWS=$(gh api "repos/$REPO/traffic/views")
          CLONES=$(gh api "repos/$REPO/traffic/clones")

          if [ -f data/traffic.json ]; then
            EXISTING=$(cat data/traffic.json)
          else
            EXISTING='{"views":[],"clones":[],"last_updated":null}'
          fi

          python3 - <<'EOF'
          import json
          from datetime import datetime, timezone

          views = json.loads('''$VIEWS''')
          clones = json.loads('''$CLONES''')
          existing = json.loads('''$EXISTING''')

          def merge(existing_list, new_list):
              by_ts = {item["timestamp"]: item for item in existing_list}
              for item in new_list:
                  ts = item["timestamp"]
                  if ts not in by_ts or item.get("count", 0) > by_ts[ts].get("count", 0):
                      by_ts[ts] = item
              return sorted(by_ts.values(), key=lambda x: x["timestamp"])

          existing["views"] = merge(existing.get("views", []), views.get("views", []))
          existing["clones"] = merge(existing.get("clones", []), clones.get("clones", []))
          existing["last_updated"] = datetime.now(timezone.utc).isoformat()

          existing["latest_14d"] = {
              "views_count": views.get("count"),
              "views_uniques": views.get("uniques"),
              "clones_count": clones.get("count"),
              "clones_uniques": clones.get("uniques")
          }

          # Save the raw data
          with open("data/traffic.json", "w") as f:
              json.dump(existing, f, indent=2)

          # ---------- Generate visual Markdown report ----------
          def fmt_date(ts):
              return ts[:10]

          # Take the last 45 days for the charts/tables (keeps it readable)
          recent_views = existing["views"][-45:]
          recent_clones = existing["clones"][-45:]

          report = []
          report.append("# Repository Traffic Report")
          report.append("")
          report.append(f"**Last updated:** {existing['last_updated'][:19]} UTC")
          report.append("")
          report.append("## Latest 14-day totals")
          report.append("")
          report.append(f"- **Clones:** {existing['latest_14d']['clones_count']} total · {existing['latest_14d']['clones_uniques']} unique")
          report.append(f"- **Views:** {existing['latest_14d']['views_count']} total · {existing['latest_14d']['views_uniques']} unique")
          report.append("")

          # Clones chart
          report.append("## Clones over time")
          report.append("")
          report.append("```mermaid")
          report.append("xychart-beta")
          report.append("    title \"Daily Clones\"")
          report.append("    x-axis [" + ", ".join(f'"{fmt_date(d["timestamp"])}"' for d in recent_clones) + "]")
          report.append("    y-axis \"Clones\" 0 --> " + str(max((d.get("count", 0) for d in recent_clones), default=10) + 5))
          report.append("    line [" + ", ".join(str(d.get("count", 0)) for d in recent_clones) + "]")
          report.append("```")
          report.append("")

          # Views chart
          report.append("## Views over time")
          report.append("")
          report.append("```mermaid")
          report.append("xychart-beta")
          report.append("    title \"Daily Views\"")
          report.append("    x-axis [" + ", ".join(f'"{fmt_date(d["timestamp"])}"' for d in recent_views) + "]")
          report.append("    y-axis \"Views\" 0 --> " + str(max((d.get("count", 0) for d in recent_views), default=10) + 5))
          report.append("    line [" + ", ".join(str(d.get("count", 0)) for d in recent_views) + "]")
          report.append("```")
          report.append("")

          # Recent table
          report.append("## Recent daily numbers")
          report.append("")
          report.append("| Date | Clones | Unique Cloners | Views | Unique Visitors |")
          report.append("|------|--------|----------------|-------|-----------------|")

          # Align by date
          clones_by_date = {fmt_date(d["timestamp"]): d for d in recent_clones}
          views_by_date = {fmt_date(d["timestamp"]): d for d in recent_views}
          all_dates = sorted(set(clones_by_date) | set(views_by_date), reverse=True)

          for date in all_dates[:30]:  # show last 30 days in the table
              c = clones_by_date.get(date, {})
              v = views_by_date.get(date, {})
              report.append(
                  f"| {date} | {c.get('count', 0)} | {c.get('uniques', 0)} | {v.get('count', 0)} | {v.get('uniques', 0)} |"
              )

          report.append("")
          report.append("---")
          report.append("*Generated automatically by the traffic logging workflow.*")

          with open("data/TRAFFIC_REPORT.md", "w") as f:
              f.write("\n".join(report))

          print("Report generated successfully.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/traffic.json data/TRAFFIC_REPORT.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update traffic history and report"
            git push
          fi
